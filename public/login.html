<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — Chicken on Wheels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main class="auth-shell">
  <section class="auth-card">
    <a class="brand" href="index.html" style="margin-bottom:20px;display:inline-flex;">
      <span class="brand-mark" aria-hidden="true"></span>
      Chicken on Wheels
    </a>
    <div class="eyebrow" id="mode-label">Login</div>
    <h1 id="title">Welcome back</h1>
    <p id="subcopy">Sign in to send and track your booking requests, plus review your orders.</p>
    <form id="form" class="field-grid">
      <div id="name-field" hidden>
        <label class="field-label" for="name">Your name</label>
        <input id="name" class="field" type="text" autocomplete="name" placeholder="Name">
      </div>
      <div>
        <label class="field-label" for="email">Email</label>
        <input id="email" class="field" type="email" autocomplete="email" placeholder="you@example.com" required>
      </div>
      <div>
        <label class="field-label" for="password">Password</label>
        <input id="password" class="field" type="password" autocomplete="current-password" minlength="6" placeholder="Password" required>
      </div>
      <button class="btn btn--gold btn--block" id="submit" type="submit">Login</button>
    </form>
    <div class="auth-helper">
      <div class="alert" id="msg" aria-live="polite">Enter your Supabase credentials to continue.</div>
      <div class="auth-actions" style="justify-content:flex-start">
        <button class="btn btn--ghost" id="switch" type="button">Create account</button>
        <a class="btn btn--ghost" href="index.html">Back to site</a>
      </div>
    </div>
  </section>
</main>

<script type="module">
import { sb, SUPABASE_CONFIGURED } from './app.js';

const form = document.getElementById('form');
const nameField = document.getElementById('name-field');
const nameInput = document.getElementById('name');
const title = document.getElementById('title');
const modeLabel = document.getElementById('mode-label');
const subcopy = document.getElementById('subcopy');
const submit = document.getElementById('submit');
const switchButton = document.getElementById('switch');
const msg = document.getElementById('msg');
const params = new URLSearchParams(window.location.search);
const next = params.get('next') || 'dashboard.html';
let signupMode = params.get('signup') === '1';

function setMode(nextMode) {
  signupMode = nextMode;
  nameField.hidden = !signupMode;
  title.textContent = signupMode ? 'Create your account' : 'Welcome back';
  modeLabel.textContent = signupMode ? 'Create account' : 'Login';
  subcopy.textContent = signupMode
    ? 'Create an account to submit booking requests and place orders.'
    : 'Sign in to send and track your booking requests, plus review your orders.';
  submit.textContent = signupMode ? 'Create account' : 'Login';
  switchButton.textContent = signupMode ? 'Have an account? Log in' : 'Create account';
}

setMode(signupMode);

if (!SUPABASE_CONFIGURED) {
  msg.textContent = 'Login is not configured yet. Add your Supabase URL and publishable key in public/config.js.';
  submit.disabled = true;
}

switchButton.addEventListener('click', () => setMode(!signupMode));

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  if (!sb) {
    msg.textContent = 'Login is not configured yet. Add your Supabase URL and publishable key in public/config.js.';
    return;
  }

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const name = nameInput.value.trim();

  submit.disabled = true;
  submit.textContent = signupMode ? 'Creating...' : 'Logging in...';
  msg.className = 'alert';
  msg.textContent = 'Please wait...';

  try {
    if (signupMode) {
      if (!name) {
        msg.className = 'alert alert--error';
        msg.textContent = 'Please add your name before creating an account.';
        return;
      }
      const { data, error } = await sb.auth.signUp({
        email,
        password,
        options: { data: { name } },
      });
      if (error) throw error;

      if (data.session) {
        window.location.href = next;
      } else {
        msg.className = 'alert alert--success';
        msg.textContent = 'Account created. Check your email to confirm it, then log in.';
        setMode(false);
      }
      return;
    }

    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;
    window.location.href = next;
  } catch (error) {
    msg.className = 'alert alert--error';
    msg.textContent = error.message || 'Unable to connect to the login service.';
  } finally {
    submit.disabled = !SUPABASE_CONFIGURED;
    submit.textContent = signupMode ? 'Create account' : 'Login';
  }
});
</script>
</body>
</html>
